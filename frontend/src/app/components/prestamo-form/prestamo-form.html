@if (equiposService.equipoSeleccionado(); as equipo) {
  <div class="card shadow-sm mt-4 border-primary">
    <div class="card-header bg-primary text-white">
      <i class="bi bi-clipboard-check"></i> Registrar préstamo — {{ equipo.nombre }}
    </div>
    <div class="card-body">

      @if (mensajeExito()) {
        <div class="alert alert-success">{{ mensajeExito() }}</div>
      }

      @if (equiposService.error()) {
        <div class="alert alert-danger">{{ equiposService.error() }}</div>
      }

      <form (ngSubmit)="registrar()">
        <div class="mb-3">
          <label class="form-label">Nombre del solicitante *</label>
          <input
            type="text"
            class="form-control"
            [ngModel]="nombreSolicitante()"
            (ngModelChange)="nombreSolicitante.set($event)"
            name="nombreSolicitante"
            required>
        </div>

        <div class="mb-3">
          <label class="form-label">Fecha estimada de devolución</label>
          <input
            type="date"
            class="form-control"
            [ngModel]="fechaDevolucion()"
            (ngModelChange)="fechaDevolucion.set($event)"
            name="fechaDevolucion">
        </div>

        <div class="mb-3">
          <label class="form-label">Observaciones</label>
          <textarea
            class="form-control"
            rows="2"
            [ngModel]="observaciones()"
            (ngModelChange)="observaciones.set($event)"
            name="observaciones"></textarea>
        </div>

        <div class="d-flex gap-2">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="enviando() || !nombreSolicitante().trim()">
            @if (enviando()) {
              <span class="spinner-border spinner-border-sm me-1"></span>
            }
            Registrar préstamo
          </button>
          <button type="button" class="btn btn-outline-secondary" (click)="cancelar()">
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>
}
